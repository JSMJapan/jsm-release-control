{
  "name": "TEST #2760 — encrypted publisher wrapper capture",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "approved_sha": {"description": "Exact reviewed main commit SHA", "required": true, "type": "string"},
        "recipient_sha256": {"description": "Reviewed public recipient certificate SHA-256", "required": true, "type": "string"}
      }
    }
  },
  "permissions": {"contents": "read"},
  "concurrency": {"group": "test-publisher-capture-encrypted", "cancel-in-progress": false},
  "jobs": {
    "offline": {
      "name": "Offline TEST publisher capture boundaries",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 3,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {"ref": "${{ github.sha }}", "persist-credentials": false}
        },
        {"run": "python3 -B -m unittest discover -s tests -p 'test_*.py'"}
      ]
    },
    "capture": {
      "name": "Owner reviewed TEST only — encrypted artifact",
      "needs": "offline",
      "if": "github.event_name == 'workflow_dispatch' && github.repository == 'JSMJapan/jsm-release-control' && github.event.repository.private == false && github.actor == 'JSMJapan' && github.triggering_actor == 'JSMJapan' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.approved_sha == github.sha",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 2,
      "environment": "test-api-readonly-access",
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {"ref": "${{ github.sha }}", "persist-credentials": false}
        },
        {
          "name": "Validate owner protection and collect ciphertext from the pinned TEST VM",
          "env": {
            "APPROVED_CAPTURE_SHA": "${{ inputs.approved_sha }}",
            "APPROVED_RECIPIENT_SHA256": "${{ inputs.recipient_sha256 }}",
            "TEST_API_ADMIN_SSH_KEY": "${{ secrets.TEST_API_ADMIN_SSH_KEY }}",
            "TEST_API_KNOWN_HOSTS": "${{ vars.TEST_API_KNOWN_HOSTS }}"
          },
          "run": "python3 -I -B scripts/test_publisher_capture_encrypted.py"
        },
        {
          "name": "Publish only the bounded CMS ciphertext",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "test-publisher-2760-cms-${{ github.run_id }}",
            "path": "${{ runner.temp }}/jsm-test-publisher-2760.cms.der",
            "if-no-files-found": "error",
            "retention-days": 1,
            "compression-level": 0
          }
        }
      ]
    }
  }
}
