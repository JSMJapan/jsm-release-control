{
  "name": "TEST #2760 — fixed PHP manifest",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "approved_sha": {
          "description": "Exact reviewed main SHA",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {"contents": "read"},
  "concurrency": {"group": "test-db-metadata-readonly", "cancel-in-progress": false},
  "jobs": {
    "offline": {
      "name": "Offline TEST PHP manifest boundaries",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 3,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {"ref": "${{ github.sha }}", "persist-credentials": false}
        },
        {"run": "python3 -B -m unittest discover -s tests -p 'test_*.py'"}
      ]
    },
    "observe": {
      "name": "Fixed TEST FPM filesystem comparison",
      "needs": "offline",
      "if": "github.event_name == 'workflow_dispatch' && github.repository == 'JSMJapan/jsm-release-control' && github.event.repository.private == false && github.actor == 'JSMJapan' && github.triggering_actor == 'JSMJapan' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.approved_sha == github.sha",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 2,
      "environment": "test-api-readonly-access",
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {"ref": "${{ github.sha }}", "persist-credentials": false}
        },
        {
          "name": "Compare eight fixed nonsecret PHP files in the observed FPM root",
          "env": {
            "APPROVED_SHA": "${{ inputs.approved_sha }}",
            "TEST_API_ADMIN_SSH_KEY": "${{ secrets.TEST_API_ADMIN_SSH_KEY }}",
            "TEST_API_KNOWN_HOSTS": "${{ vars.TEST_API_KNOWN_HOSTS }}"
          },
          "run": "python3 -I -B scripts/test_php_manifest_readonly.py"
        }
      ]
    }
  }
}
