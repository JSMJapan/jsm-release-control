{
  "name": "TEST #1568 — fixed read-only access identity probe",
  "on": {"workflow_dispatch": {}},
  "permissions": {"contents": "read"},
  "concurrency": {"group": "test-api-readonly-access", "cancel-in-progress": false},
  "jobs": {
    "offline": {
      "name": "Offline TEST access probe",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 3,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {"ref": "${{ github.sha }}", "persist-credentials": false}
        },
        {"run": "python3 -B -m unittest discover -s tests -p 'test_*.py'"}
      ]
    },
    "probe": {
      "name": "Fixed TEST SSH and sudo identity observation",
      "needs": "offline",
      "if": "github.event_name == 'workflow_dispatch' && github.repository == 'JSMJapan/jsm-release-control' && github.event.repository.private == false && github.actor == 'JSMJapan' && github.triggering_actor == 'JSMJapan' && github.ref == 'refs/heads/main' && github.run_attempt == 1",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 2,
      "environment": "test-api-readonly-access",
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {"ref": "${{ github.sha }}", "persist-credentials": false}
        },
        {
          "name": "Verify fixed public policy and host pin, then observe only SSH and bounded sudo identity",
          "env": {
            "TEST_API_ADMIN_SSH_KEY": "${{ secrets.TEST_API_ADMIN_SSH_KEY }}",
            "TEST_API_KNOWN_HOSTS": "${{ vars.TEST_API_KNOWN_HOSTS }}"
          },
          "run": "python3 -I -B scripts/test_api_readonly_access.py"
        }
      ]
    }
  }
}
