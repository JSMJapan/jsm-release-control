name: 'Apache #1568 — fixed admin read-only transport probe'

# Owner supplies only an EXISTING admin key in the already-protected environment.
# No key generation/attach, Hostinger API, private source, install or server writes.
# Encrypted keys fail closed in BatchMode; no password/passphrase fallback.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: apache-admin-readonly-probe
  cancel-in-progress: false

jobs:
  offline:
    name: 'Offline admin probe'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 -B -m unittest discover -s tests -p 'test_*.py'

  probe:
    name: 'Fixed admin read-only observation'
    needs: offline
    if: >-
      github.event_name == 'workflow_dispatch' && github.repository == 'JSMJapan/jsm-release-control' &&
      github.event.repository.private == false && github.actor == 'JSMJapan' &&
      github.triggering_actor == 'JSMJapan' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: apache-parity-bootstrap
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: 'Verify owner/main policy and exact trusted host pin; stat two fixed Apache paths'
        env:
          APACHE_BOOTSTRAP_ADMIN_SSH_KEY: ${{ secrets.APACHE_BOOTSTRAP_ADMIN_SSH_KEY }}
          APACHE_BOOTSTRAP_KNOWN_HOSTS: ${{ vars.APACHE_BOOTSTRAP_KNOWN_HOSTS }}
        run: python3 -I -B scripts/apache_admin_readonly_probe.py
