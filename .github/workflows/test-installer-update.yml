{
  "name": "TEST #2760 — guarded installer report hook update",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "approved_sha": {
          "description": "Exact reviewed main commit SHA",
          "required": true,
          "type": "string"
        },
        "operation": {
          "description": "One exact installer operation",
          "required": true,
          "type": "choice",
          "options": [
            "CHECK",
            "APPLY",
            "ROLLBACK"
          ]
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "test-installer-write",
    "cancel-in-progress": false
  },
  "jobs": {
    "offline": {
      "name": "Offline TEST installer writer checks",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 3,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "run": "python3 -B -m unittest discover -s tests -p 'test_*.py'"
        }
      ]
    },
    "update": {
      "name": "Protected dedicated TEST installer writer",
      "needs": "offline",
      "if": "github.event_name == 'workflow_dispatch' && github.repository == 'JSMJapan/jsm-release-control' && github.event.repository.private == false && github.actor == 'JSMJapan' && github.triggering_actor == 'JSMJapan' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.approved_sha == github.sha",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 2,
      "environment": "test-installer-write",
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "name": "Validate separate writer policy and run the one scoped operation",
          "env": {
            "APPROVED_WORKFLOW_SHA": "${{ inputs.approved_sha }}",
            "INSTALLER_OPERATION": "${{ inputs.operation }}",
            "TEST_INSTALLER_WRITE_SSH_KEY": "${{ secrets.TEST_INSTALLER_WRITE_SSH_KEY }}",
            "TEST_INSTALLER_WRITE_KNOWN_HOSTS": "${{ vars.TEST_INSTALLER_WRITE_KNOWN_HOSTS }}"
          },
          "run": "python3 -I -B scripts/test_installer_update_action.py"
        }
      ]
    }
  }
}
