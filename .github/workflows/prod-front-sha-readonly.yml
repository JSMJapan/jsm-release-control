{
  "name": "PROD #2738 — three fixed front source digests only",
  "on": {"workflow_dispatch": {}},
  "permissions": {"contents": "read"},
  "concurrency": {"group": "apache-admin-readonly-probe", "cancel-in-progress": false},
  "jobs": {
    "offline": {
      "name": "Offline fixed front SHA reader",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 3,
      "steps": [
        {"uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262", "with": {"ref": "${{ github.sha }}", "persist-credentials": false}},
        {"run": "python3 -B -m unittest discover -s tests -p 'test_*.py'"}
      ]
    },
    "probe": {
      "name": "Fixed PROD metadata read, no source bytes",
      "needs": "offline",
      "if": "github.event_name == 'workflow_dispatch' && github.repository == 'JSMJapan/jsm-release-control' && github.event.repository.private == false && github.actor == 'JSMJapan' && github.triggering_actor == 'JSMJapan' && github.ref == 'refs/heads/main' && github.run_attempt == 1",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 2,
      "environment": "apache-parity-bootstrap",
      "steps": [
        {"uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262", "with": {"ref": "${{ github.sha }}", "persist-credentials": false}},
        {
          "name": "Verify owner/main policy and original host pin; hash exactly three fixed source files",
          "env": {
            "APACHE_BOOTSTRAP_ADMIN_SSH_KEY": "${{ secrets.APACHE_BOOTSTRAP_ADMIN_SSH_KEY }}",
            "APACHE_BOOTSTRAP_KNOWN_HOSTS": "${{ vars.APACHE_BOOTSTRAP_KNOWN_HOSTS }}"
          },
          "run": "python3 -I -B scripts/prod_front_sha_readonly.py"
        }
      ]
    }
  }
}
