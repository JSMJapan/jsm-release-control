name: 'TEST #1620 — isolated Eva STAGE/CLEANUP'
on:
  pull_request:
    paths:
      - '.github/workflows/eva-isolated-stage-1620.yml'
      - 'ops/eva-test-1620/**'
      - 'scripts/eva_test_*'
      - 'scripts/article_test_images.py'
      - 'tests/test_eva_test_*'
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact reviewed control main commit
        required: true
        type: string
      operation:
        description: Provision the dedicated receiver, stage an isolated profile, or clean up one exact run
        required: true
        type: choice
        options: [PREFLIGHT, BOOTSTRAP, STAGE, STAGE_LIVE, CLEANUP]
      cleanup_run:
        description: Twelve lowercase hexadecimal characters from the Eva receipt
        required: false
        type: string
      route_preflight_run:
        description: BOOTSTRAP and STAGE_LIVE only. Successful PREFLIGHT run on this exact main SHA
        required: false
        type: string
      receiver_public_key:
        description: BOOTSTRAP only. Public OpenSSH Ed25519 key without comment
        required: false
        type: string
      receiver_public_key_sha256:
        description: BOOTSTRAP only. Reviewed SHA-256 of that public key with one trailing newline
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'test-db-metadata-readonly' || format('eva-stage-1620-pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Ensure the native disposable Apache fixture is available
        run: |
          if [ ! -x /usr/sbin/apache2 ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends apache2
          fi
      - run: python3 -B -m unittest discover -s tests -p 'test_*.py'
      - name: Verify the exact Eva boundary on disposable Docker containers
        if: github.event_name == 'pull_request'
        run: |
          sudo -n /usr/bin/docker --host unix:///run/docker.sock version --format '{{.Server.Version}}'
          sudo -n /usr/bin/docker --host unix:///run/docker.sock pull --quiet docker.io/library/busybox@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          sudo -n env JSM_EVA_NATIVE_DOCKER=1 python3 -B -m unittest discover -s tests -p test_eva_test_boundary.py -v
      - run: sh -n scripts/eva_test_forced_command.sh
      - run: echo '::notice file=scripts/eva_test_install.py,line=1,title=JSM Eva offline fixture::Offline test receipt transport'
  install:
    name: Owner-approved finite Eva TEST operation
    needs: offline
    if: inputs.operation != 'BOOTSTRAP' && inputs.operation != 'PREFLIGHT' && github.event_name == 'workflow_dispatch' && github.repository == 'JSMJapan/jsm-release-control' && github.event.repository.private == false && github.actor == 'JSMJapan' && github.triggering_actor == 'JSMJapan' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.approved_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    environment: eva-isolated-stage-1620
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify fixed source, TEST receiver and bounded receipt
        if: inputs.operation != 'STAGE_LIVE'
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          OPERATION: ${{ inputs.operation }}
          CLEANUP_RUN: ${{ inputs.cleanup_run }}
          GH_TOKEN: ${{ github.token }}
          STOREFRONT_ACTIONS_READ_TOKEN: ${{ secrets.STOREFRONT_ACTIONS_READ_TOKEN }}
          EVA_STAGE_SSH_KEY: ${{ secrets.EVA_STAGE_SSH_KEY }}
          EVA_STAGE_KNOWN_HOSTS: ${{ vars.EVA_STAGE_KNOWN_HOSTS }}
        run: python3 -I -B scripts/eva_test_install.py

      - name: Verify the dedicated live profile and start its short approved lease
        if: inputs.operation == 'STAGE_LIVE'
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          OPERATION: ${{ inputs.operation }}
          CLEANUP_RUN: ''
          GH_TOKEN: ${{ github.token }}
          STOREFRONT_ACTIONS_READ_TOKEN: ${{ secrets.STOREFRONT_ACTIONS_READ_TOKEN }}
          EVA_STAGE_SSH_KEY: ${{ secrets.EVA_STAGE_SSH_KEY }}
          EVA_STAGE_KNOWN_HOSTS: ${{ vars.EVA_STAGE_KNOWN_HOSTS }}
          ROUTE_PREFLIGHT_RUN: ${{ inputs.route_preflight_run }}
          EVA_ISOLATED_GATE_USERNAME: ${{ secrets.EVA_ISOLATED_GATE_USERNAME }}
          EVA_ISOLATED_GATE_PASSWORD: ${{ secrets.EVA_ISOLATED_GATE_PASSWORD }}
          EVA_ISOLATED_BRIDGE_SECRET: ${{ secrets.EVA_ISOLATED_BRIDGE_SECRET }}
          EVA_ISOLATED_ANTHROPIC_KEY: ${{ secrets.EVA_ISOLATED_ANTHROPIC_KEY }}
        run: python3 -I -B scripts/eva_test_install.py

  bootstrap:
    name: Owner-approved Eva receiver bootstrap on jsm-sandbox
    needs: offline
    if: (inputs.operation == 'BOOTSTRAP' || inputs.operation == 'PREFLIGHT') && github.event_name == 'workflow_dispatch' && github.repository == 'JSMJapan/jsm-release-control' && github.event.repository.private == false && github.actor == 'JSMJapan' && github.triggering_actor == 'JSMJapan' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.approved_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: test-api-readonly-access
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install only the approved Eva receiver and expiry unit files
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          OPERATION: ${{ inputs.operation }}
          APPROVED_SCOPE: ${{ inputs.operation == 'PREFLIGHT' && 'OBSERVE_EVA_TEST_ROUTE' || 'INSTALL_EVA_ONLY_RECEIVER' }}
          APPROVED_PUBLIC_KEY_SHA256: ${{ inputs.receiver_public_key_sha256 }}
          ROUTE_PREFLIGHT_RUN: ${{ inputs.route_preflight_run }}
          EVA_STAGE_PUBLIC_KEY: ${{ inputs.receiver_public_key }}
          GH_TOKEN: ${{ github.token }}
          TEST_API_ADMIN_SSH_KEY: ${{ secrets.TEST_API_ADMIN_SSH_KEY }}
          TEST_API_KNOWN_HOSTS: ${{ vars.TEST_API_KNOWN_HOSTS }}
        run: python3 -I -B scripts/eva_test_bootstrap.py
