{
  "name": "TEST #2760 \u2014 finite isolated article STAGE/CLEANUP",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "approved_sha": {
          "description": "Exact reviewed control main SHA",
          "required": true,
          "type": "string"
        },
        "operation": {
          "description": "New local-only 2h stage, or owned-run cleanup",
          "required": true,
          "type": "choice",
          "options": [
            "STAGE",
            "CLEANUP"
          ]
        },
        "cleanup_run": {
          "description": "CLEANUP only: exact12 lowercase hex run from receipt",
          "required": false,
          "type": "string",
          "default": ""
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "test-db-metadata-readonly",
    "cancel-in-progress": false
  },
  "jobs": {
    "offline": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 3,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "run": "python3 -B -m unittest discover -s tests -p 'test_*.py'"
        }
      ]
    },
    "install": {
      "name": "Owner-approved finite isolated TEST operation",
      "needs": "offline",
      "if": "github.event_name == 'workflow_dispatch' && github.repository == 'JSMJapan/jsm-release-control' && github.event.repository.private == false && github.actor == 'JSMJapan' && github.triggering_actor == 'JSMJapan' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.approved_sha == github.sha",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 30,
      "environment": "test-api-readonly-access",
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "name": "Verify policy and fixed private artifact, stream once to the pinned TEST host",
          "env": {
            "APPROVED_SHA": "${{ inputs.approved_sha }}",
            "OPERATION": "${{ inputs.operation }}",
            "CLEANUP_RUN": "${{ inputs.cleanup_run }}",
            "STOREFRONT_ACTIONS_READ_TOKEN": "${{ secrets.STOREFRONT_ACTIONS_READ_TOKEN }}",
            "TEST_API_ADMIN_SSH_KEY": "${{ secrets.TEST_API_ADMIN_SSH_KEY }}",
            "TEST_API_KNOWN_HOSTS": "${{ vars.TEST_API_KNOWN_HOSTS }}"
          },
          "run": "python3 -I -B scripts/article_test_install.py"
        }
      ]
    }
  }
}
